<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wardum — Photography</title>
    <meta name="description" content="Photography by Viktor Wardum. Based in Reykjavik." />
    <meta name="theme-color" content="#ffffff" />

    <meta property="og:title" content="Wardum — Photography" />
    <meta property="og:description" content="Photography by Viktor Wardum. Based in Reykjavik." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wardumphotos.is/" />
    <meta property="og:image" content="https://wardumphotos.is/images/thumb/DSC00233.jpg" />

    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="js/gallery.js"></script>
  </head>

  <body>
    <a class="skip" href="#photographs">Skip to photographs</a>

    <div class="page">
      <header class="profile">
        <div class="profile__avatar" data-avatar></div>
        <h1 class="profile__name" data-name></h1>
        <p class="profile__tagline" data-tagline></p>
        <div class="profile__bio" data-about></div>
        <p class="booking" data-booking></p>
        <p class="links">
          <a data-instagram rel="me noopener" target="_blank"></a>
          <span aria-hidden="true">·</span>
          <a data-email></a>
        </p>
      </header>

      <nav class="series-index" data-index aria-label="Series"></nav>

      <main id="photographs">
        <div data-galleries></div>
      </main>

      <footer class="footer">
        <p>&copy; 2026 Viktor Wardum</p>
      </footer>
    </div>

    <div class="lightbox" data-lightbox role="dialog" aria-modal="true" aria-label="Photograph">
      <button class="lightbox__close" data-close type="button" aria-label="Close">&times;</button>
      <button class="lightbox__nav lightbox__nav--prev" data-prev type="button" aria-label="Previous">&#8249;</button>
      <button class="lightbox__nav lightbox__nav--next" data-next type="button" aria-label="Next">&#8250;</button>
      <div class="lightbox__stage" data-stage></div>
      <p class="lightbox__counter" data-counter aria-live="polite"></p>
    </div>
  </body>
</html>
